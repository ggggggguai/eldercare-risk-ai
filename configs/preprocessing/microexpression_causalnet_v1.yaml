schema_version: microexpression_causalnet_preprocess_v1
task_id: FLOW-ME-004

image_size: 28
crop_size: 14
flow_width: 32
flow_height: 32
spatial_variant: source_compatible_roi
flow_estimator: farneback
pyr_scale: 0.5
levels: 3
winsize: 15
iterations: 3
poly_n: 5
poly_sigma: 1.2
flags: 0
magnitude_quantile: 0.995

route_order:
  - onset_to_apex_flow
  - apex_to_offset_flow
  - onset_to_apex_direction
  - apex_to_offset_direction

flow_channels:
  - u
  - v
  - optical_strain

direction_map:
  angle_to_hue: "(atan2(v,u)+pi)/(2*pi)*179"
  magnitude_to: saturation
  value: 255
  opencv_conversion: "HSV uint8 -> RGB float32"
  output_range: [0.0, 1.0]

variants:
  source_compatible_roi: "CausalNet upstream four 14x14 ROI patches in a 2x2 collage"
  full_face: "aligned full face resized to 28x28"

method_boundary:
  upstream_repository: https://github.com/tony19980810/CausalNet
  upstream_commit: 7bdf163face030eeae4358fc7638cf538305acce
  upstream_license: MIT
  upstream_bit_exact: false
  paper_reproduction_claim: false
  deployment_eligible: false
