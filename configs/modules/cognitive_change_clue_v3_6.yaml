schema_version: cognitive_change_clue_config_v3_6
model_version: cognitive-mm-v3.6.0
feature_version: cognitive_features_v3.6.0
seed: 20261018

dataset:
  name: CogPic
  source_scope: official_train_only
  source_manifest: data/processed/cognitive_change_clue/v3.3.0/cogpic_manifest.parquet
  source_split: data/processed/cognitive_change_clue/v3.3.0/cogpic_subject_split_v33.json
  source_feature_root: data/processed/cognitive_change_clue/v3.3.0/features
  source_lightweight_root: data/processed/cognitive_change_clue/v3.4.0/lightweight_features
  source_pooling_root: data/processed/cognitive_change_clue/v3.4.0/pooling_features
  processed_root: data/processed/cognitive_change_clue/v3.6.0
  expected_official_train_subjects: 459
  expected_official_test_subjects: 115
  expected_tasks: 1377
  expected_tasks_per_subject: 3
  label_order: [HC, MCI, AD]
  demographic_audit_fields: [age, age_band, sex_code, education_code]

cross_validation:
  outer_folds: 5
  development_seed: 20261018
  confirmation_seeds: [20261028, 20261108, 20261118]
  inner_calibration_fraction: 0.15
  inner_selection_folds: 4
  calibration_seed_offset: 1000
  inner_seed_offset: 2000
  subject_sort: unicode_codepoint_ascending
  stratification:
    preferred: diagnosis_x_age_band_x_sex_code
    age_bands:
      - {name: lt65, minimum: null, maximum: 64}
      - {name: 65_74, minimum: 65, maximum: 74}
      - {name: ge75, minimum: 75, maximum: null}
    sparse_fallback: diagnosis_x_age_band
    collapse_entire_diagnosis_age_layer_when_any_sex_cell_below: 10
    collapse_when_sex_cell_absent: true
    rare_inner_assignment: deterministic_stratified_round_robin
    metric_dependent_restratification_allowed: false

subject_bag:
  task_slots: [1, 2, 3]
  modalities: [audio, text, face]
  dimensions: {audio: 768, text: 768, face: 512}
  identifier_policy: metadata_only_not_model_input
  demographic_policy: audit_and_training_control_only_not_inference_input
  require_at_least_one_audio_task: true

development_candidates:
  baseline: {id: V36-A0, implementation: weighted_logit, prototype: P0, loss: LOSS-3}
  age_balance:
    A1: {weight_clip: [0.5, 2.0], strata: diagnosis_x_age_band}
    A2: {gradient_reversal_weights: [0.02, 0.05, 0.10]}
    A3: {fit_scope: inner_train_only, mutually_exclusive_with: [A1, A2]}
  hierarchical_heads:
    B1: [main, hc_vs_mci]
    B2: [main, hc_vs_mci, cumulative_ordinal]
    B3: [main, hc_vs_mci, cumulative_ordinal, mci_vs_ad]
  temporal_audio:
    C1: mean_std_statistics_pooling
    C2: attentive_statistics_pooling
    C3: two_layer_small_tcn
  restricted_quality_gate:
    allowed_inputs: [modality_quality, missing_mask, valid_task_count]
    forbidden_inputs: [subject_id, sample_id, path, diagnosis_prefix, age, sex_code, education_code, moca]

adoption_gates:
  development:
    minimum_pooled_auc_gain: 0.005
    minimum_positive_outer_folds: 3
    maximum_fold_auc_std_increase: 0.005
    hc_mci_auc_must_not_decrease: true
    maximum_lt65_sensitivity_drop: 0.05
  confirmation:
    minimum_mean_auc_gain: 0.005
    minimum_positive_repeats: 2
    maximum_repeat_sample_std: 0.012
    minimum_hc_mci_auc_gain_or_lt65_sensitivity_gain: [0.010, 0.10]
    minimum_sensitivity: 0.80
    maximum_ece: 0.0716

evaluation:
  primary_task: hc_vs_non_hc
  primary_metric: subject_roc_auc
  target_sensitivity: 0.80
  official_test_enabled: false
  official_test_labels_enabled: false
  official_test_media_enabled: false
  medical_diagnosis_output: false

outputs:
  split_manifest: data/processed/cognitive_change_clue/v3.6.0/cogpic_subject_nested_cv_v36.json
  split_audit: data/processed/cognitive_change_clue/v3.6.0/cogpic_subject_nested_cv_v36_audit.json
  subject_bag_index: data/processed/cognitive_change_clue/v3.6.0/cogpic_subject_bags_v36.jsonl
  data_audit: data/processed/cognitive_change_clue/v3.6.0/cogpic_v36_data_audit.json
  confounding_audit: reports/cognitive_change_clue/v3.6.0/opt_cog_014_confounding_audit.json
  report_root: reports/cognitive_change_clue/v3.6.0
  model_root: models/mental_health/cognitive_change_clue/v3.6.0
