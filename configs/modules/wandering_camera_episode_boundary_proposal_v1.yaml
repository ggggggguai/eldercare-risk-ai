schema_version: wandering-camera-episode-boundary-proposal-config-v1
purpose: continuous_episode_boundary_proposal_implementation_only

camera_chain:
  path: configs/modules/wandering_camera_v1.yaml

sampling:
  bucket_seconds: 0.5
  minimum_track_confidence: 0.25
  maximum_internal_gap_buckets: 3

state_machine:
  movement_start_min_buckets: 5
  movement_start_min_displacement_body_heights: 0.25
  stationary_max_displacement_body_heights: 0.08
  stationary_dwell_candidate_seconds: 15.0
  minimum_episode_duration_seconds: 2.0

protocol:
  movement_start_candidate_basis: b01_development_repeated_failure_analysis
  movement_start_candidate_validated: true
  stationary_dwell_candidate_basis: b01_development_dwell_comparison_retained_15_seconds
  stationary_dwell_candidate_validated: true

output_schemas:
  proposal: wandering-camera-episode-boundary-proposal-v1
  summary: wandering-camera-episode-boundary-proposal-summary-v1
  diagnostic: wandering-camera-episode-boundary-proposal-diagnostic-v1

data_access:
  shape_truth: false
  purpose_truth: false
  frozen_model: false
  training: false
  sealed_camera: false
