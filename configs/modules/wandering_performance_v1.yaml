schema_version: wandering-performance-config-v2
purpose: supervised_development

model:
  forward_config_path: configs/modules/wandering_topowander_mpt_v1.yaml
  initialization: scratch

data:
  rf_config_path: configs/modules/wandering_rf_v1.yaml
  development_bundle_path: data/processed/wandering/performance/m0s_development_v1
  bundle_mode: development

runtime:
  device: cpu
  intra_op_threads: 8
  inter_op_threads: 1
  num_workers: 0
  pin_memory: false

training:
  seeds: [20260731, 20260801, 20260802]
  primary_seed: 20260731
  max_epochs: 50
  batch_size: 64
  gradient_clip_norm: 5.0
  shuffle: true

loss:
  subtype_loss_weight: 1.0
  binary_weighting: train_equal_source_class
  subtype_weighting: train_inverse_frequency

optimizer:
  name: adamw
  learning_rate: 0.001
  weight_decay: 0.0001
  betas: [0.9, 0.999]
  eps: 1.0e-8

early_stopping:
  min_epochs: 12
  patience: 8

checkpoint:
  save_every_epochs: 1
  keep_epoch_checkpoints: true

smoke:
  seed: 20260731
  samples_per_pattern: 4
  max_epochs: 120
  batch_size: 16
  learning_rate: 0.01
  weight_decay: 0.0
  maximum_final_loss_ratio: 0.35
  mask_invariance_atol: 1.0e-6

reporting:
  target_macro_f1: 0.95
  class_recall_gate: 0.90
  representative_error_limit: 20
  inference_batch_size: 64
  inference_warmup_iterations: 5
  inference_measurement_iterations: 20

baselines:
  rf:
    four_class: reports/mental_health/wandering_step5/development/v1/validation_predictions/four_class_seed_{seed}.jsonl
    binary: reports/mental_health/wandering_step5/development/v1/validation_predictions/binary_seed_{seed}.jsonl
  tcn:
    four_class: reports/mental_health/wandering_step6/development/v1/validation_predictions/four_class/seed_{seed}.jsonl
    binary: reports/mental_health/wandering_step6/development/v1/validation_predictions/binary/seed_{seed}.jsonl
