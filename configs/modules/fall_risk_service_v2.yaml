release_id: fall-risk-competition-v2-20260827
model_path: models/yolov8n-pose.pt
# 2026-08-19 正式比赛交付冻结：seed 43 为步态主分支。
# 任务/输入契约不兼容、观测不足或推理失败时规则 baseline 自动兜底。
gait_model_path: reports/fall_risk/gait_observable_context_v2/splitv3-3342705-scfaux-v1/pretrained-seed43/best_model.pt
gait_model_device: cpu
gait_model_window_frames: 16
# 2026-08-19 正式比赛交付冻结：seed 42 TCN 为坐站默认主分支。
# TCN 无事件、输入不足或推理失败时规则 baseline 自动兜底。
sit_stand_runtime_mode: experimental_tcn
sit_stand_model_path: reports/fall_risk/sit_stand_continuous_tcn_v2/sitstandsplit_11e163684e3bb898a5c3508d/seed42-pilot-loss-scale-fixed/best_model.pt
sit_stand_model_device: cpu
sit_stand_model_batch_size: 128
# 2026-08-27 competition v2：规则先生成因果候选，ExtraTrees 负责重评分；
# 输入质量不足或单次模型推理失败时保留规则 fallback。
near_fall_runtime_mode: tabular_rescorer
near_fall_model_path: reports/fall_risk/fall_self_near_fall_tabular_v2/seed42/best_model.joblib
near_fall_score_threshold: 0.3815
near_fall_alert_cooldown_sec: 15.0
# 正式比赛交付冻结三 seed TCN 主评分；保留 experimental_tcn 枚举以兼容
# 现有运行契约。原始概率达到 0.5 时按现有
# 跌倒强触发契约输出 0.9。窗口不足或推理失败时自动回退规则状态机。
fall_event_runtime_mode: experimental_tcn
fall_event_shadow_checkpoint_paths:
  - reports/fall_risk/fall_event_continuous_tcn_v2/seed42/best_model.pt
  - reports/fall_risk/fall_event_continuous_tcn_v2/seed43/best_model.pt
  - reports/fall_risk/fall_event_continuous_tcn_v2/seed44/best_model.pt
fall_event_shadow_device: cpu
fall_event_shadow_threshold: 0.5
api_token: change-me
callback_token: change-me
max_inference_fps: 10.0
# 当前模型事实源保持 640；修改后需重新验证关键点覆盖和四分支采样门禁。
pose_inference_size: 640
stream_reader_backend: ffmpeg
ffmpeg_scale_width: 640
pose_window_sec: 10.0
analysis_interval_sec: 0.5
fusion_interval_sec: 2.0
primary_lost_timeout_sec: 2.0
event_cooldown_sec: 30.0
callback_timeout_sec: 5.0
callback_retry_delays_sec: [0.5, 1.0, 2.0]
# 进程内 outbox。容量满时普通版本可被受保护的紧急/终止版本替换；
# 紧急和 episode 唯一终止版本自身不会被静默覆盖。
outbox_capacity: 32
outbox_drain_timeout_sec: 3.0
session_stop_timeout_sec: 5.0
frame_queue_capacity: 2
stream_open_timeout_ms: 5000
stream_read_timeout_ms: 5000
reconnect_attempts: 3
reconnect_delay_sec: 1.0
# 只有持续达到任一门槛的连接才会清零连续失败预算；短流不能无限重连。
reconnect_stable_after_sec: 30.0
reconnect_stable_after_frames: 120
scene_risk_scores:
  bathroom: 0.7
  bedroom_bedside: 0.5
  stairs: 0.8
  living_room: 0.1
  home: 0.1
branch_quality:
  gait:
    min_frames: 8
    min_valid_frame_ratio: 0.6
    min_keypoint_coverage: 0.7
    min_window_coverage_sec: 1.0
    min_effective_fps: 4.0
    max_gap_sec: 1.0
  sit_stand:
    min_frames: 8
    min_valid_frame_ratio: 0.6
    min_keypoint_coverage: 0.7
    min_window_coverage_sec: 1.0
    min_effective_fps: 4.0
    max_gap_sec: 1.0
  near_fall:
    min_frames: 5
    min_valid_frame_ratio: 0.6
    min_keypoint_coverage: 0.6
    min_window_coverage_sec: 0.5
    min_effective_fps: 6.0
    max_gap_sec: 0.75
  fall_state:
    min_frames: 2
    min_valid_frame_ratio: 0.6
    min_keypoint_coverage: 0.6
    min_window_coverage_sec: 0.1
    min_effective_fps: 6.0
    max_gap_sec: 0.75
fall_state:
  observation_window_sec: 1.0
  min_quality: 0.6
  hip_drop_threshold: 0.18
  center_drop_threshold: 0.15
  horizontal_angle_threshold: 60.0
  static_duration_sec: 10.0
  static_motion_threshold: 0.02
  # 工程生命周期语义，不是医学确认或效果阈值。
  recovery_upright_angle_threshold: 45.0
  recovery_motion_threshold: 0.05
  recovery_confirmation_sec: 3.0
  episode_ttl_sec: 30.0
