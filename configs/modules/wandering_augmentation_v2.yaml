generation:
  target_points: 80
  synthetic_bucket_seconds: 0.5
  synthetic_bucket_time: true
  model_temporal_features_enabled: false
  virtual_canvas: [1920, 1080]
  base_center: [0.5, 0.5]
  base_fit_extent: 0.70
  base_visible_margin: 0.15
  base_span_epsilon: 1.0e-6
  coordinate_convention: column_vector_homogeneous
  matrix_order: "T(center+translation) @ Projective @ Shear @ Anisotropic @ Uniform @ Rotation @ T(-center)"
  axis_parameter_sampling:
    translation_xy: independent_xy
    anisotropic_scale: independent_xy
    shear: independent_xy
    projective: independent_xy
  local_shape_control_before_projective: true
  local_shape_offset_sampling: uniform_magnitude_uniform_angle
  local_shape_angle_radians: "[0, 2*pi)"
  local_shape_control_indices: [0, 8, 16, 24, 32, 40, 48, 56, 64, 72, 79]
  local_shape_smoothing: centered_moving_average_5
  local_shape_smoothing_padding: replicate_edge
  protected_local_offsets_forced_zero_after_smoothing: true
  bbox_width_to_height: 0.40
  virtual_reference_height: 0.20
  virtual_height_clip: [0.06, 0.60]
  bbox_bottom_offset_axis: y_only
  bbox_bottom_offset_sign: rademacher_equal_probability
  bbox_bottom_offset_scale: current_noisy_bbox_height
  bbox_height_noise_mode: additive_ar1
  bbox_height_noise_rho_source: sampled_position_ar1_rho
  bbox_height_noise_initial_state: 0.0
  bbox_height_noise_sigma_semantics: stationary_standard_deviation
  bbox_height_noise_post_clip: [0.06, 0.60]
  quantized_aspect_ratio: [16, 9]
  bbox_quantization_coordinates: [x1, y1, x2, y2]
  bbox_quantization_rounding: floor_pixel_plus_half
  quantized_degenerate_bbox_policy: omit_tracking_row
  quantize_then_rescale_to_virtual_canvas: true
  synthetic_video_fps: 30.0
  synthetic_video_duration_seconds: 40.0
  observed_track_confidence: 1.0
  frame_id_rounding: floor_x_plus_half
  timestamp_from_frame_id: true
  ar1_initial_state: [0.0, 0.0]
  position_sigma_semantics: stationary_standard_deviation
  ar1_innovation_clip_standard_deviations: 3.0
  ar1_innovation_policy: single_gaussian_draw_then_clip
  random_missing_count_rounding: floor_n_times_fraction_plus_half
  random_missing_without_replacement: true
  contiguous_block_independent_of_random_missing: true
  missing_masks_allow_overlap: true
  crop_edge_order: [left, right, top, bottom]
  crop_requires_full_bbox_visible: true
  out_of_view_policy: omit_tracking_row
  store_realized_parameters: true
  train_severities: [low, medium]
  validation_severities: [low, medium, high]
  max_train_attempts_per_severity: 4
  validation_attempts_per_severity: 1

