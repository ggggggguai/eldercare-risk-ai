schema_version: wandering-camera-episode-boundary-eval-config-v1
purpose: boundary_evaluator_implementation_only

camera_chain:
  path: configs/modules/wandering_camera_v1.yaml

matching_policy:
  policy_id: m0cam-ep2a-s1b-b01-development-frozen-v1
  minimum_temporal_iou: 0.25
  maximum_onset_delta_sec: 10.0
  validated: true

evaluation_views:
  all_locomotion_candidates: [proposed, uncertain]
  proposed_only_conditional: [proposed]

duration_bands:
  - {name: short, minimum_sec: 0.0, maximum_sec_exclusive: 15.0}
  - {name: medium, minimum_sec: 15.0, maximum_sec_exclusive: 40.0}
  - {name: long, minimum_sec: 40.0, maximum_sec_exclusive: null}

failure_thresholds:
  low_tiou: 0.50
  large_onset_error_sec: 2.0
  large_offset_error_sec: 2.0
  fragmentation_max_duration_sec: 2.0
  fragmentation_max_gap_sec: 1.0
  validated: false

data_access:
  shape_truth: false
  shape_predictions: false
  frozen_model: false
  training: false
  sealed_camera: false
