schema_version: gait-hierarchical-training-config-v1
task: gait_instability_vs_normal_activity
target_profile: observable_instability_b02_b04
current_status: development_only

dataset:
  target_fps: 4.0
  window_sec: 4.0
  window_frames: 16
  stride_frames: 8
  max_gap_sec: 0.5
  min_observed_frames: 10
  max_windows_per_segment: 4

model:
  use_quality_as_feature: false
  hierarchical_walking_gate: true
  walking_action_ids: [A01, B01, B02, B03, B04]
  final_probability: p_walking_times_p_abnormal_given_walking

training:
  epochs: 80
  batch_size: 16
  hidden_channels: 48
  kernel_size: 5
  dilations: [1, 2, 4, 8]
  dropout: 0.20
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 15
  walking_gate_loss_weight: 0.25
  pretrained_checkpoint: reports/fall_risk/action_pretraining_v2_semantic5/development-20260803/encoder.pt
  freeze_encoder_epochs: 8
  seeds: [42, 43, 44]

augmentation:
  mirror_probability: 0.5
  temporal_shift_frames: 1
  keypoint_dropout_probability: 0.05
  coordinate_jitter_std: 0.005

gates:
  partition_scheme: frozen
  test_metrics_allowed: false
  runtime_integration_allowed: false
  formal_replacement_requires_training_ready_action_type: true
  validation_positive_windows_observed: 2
