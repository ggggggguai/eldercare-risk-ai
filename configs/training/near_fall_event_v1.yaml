schema_version: near-fall-event-training-config-v1
task: near_fall_recovery_confirmation_v1
status: infrastructure_only_until_v3_training_ready

dataset:
  target_fps: 8.0
  window_sec: 3.0
  stride_sec: 0.5
  max_gap_sec: 0.2
  min_observed_frames: 12
  min_usable_frame_ratio: 0.6
  min_joint_coverage: 0.7
  min_mean_joint_quality: 0.3
  max_windows_per_event: 4
  seed: 42

tcn_profiles:
  synthetic_smoke:
    epochs: 30
    batch_size: 8
    hidden_channels: 12
    kernel_size: 3
    dilations: [1, 2]
    dropout: 0.0
    learning_rate: 0.01
    weight_decay: 0.0
    patience: 30
    seed: 42
    device: cpu
  pilot:
    epochs: 40
    batch_size: 32
    hidden_channels: 24
    kernel_size: 3
    dilations: [1, 2, 4, 8]
    dropout: 0.1
    learning_rate: 0.001
    weight_decay: 0.0001
    patience: 8
    seed: 42
    device: auto

test_policy: not_read_not_evaluated_by_default
notes:
  - Positive windows end at recovery_frame and do not claim onset-time early warning.
  - progressed_to_fall is a binary negative; there is no outcome auxiliary head.
  - Synthetic smoke output is infrastructure evidence only, never a model metric.
