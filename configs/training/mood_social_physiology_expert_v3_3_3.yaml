config_version: mood-social-physiology-training-config-v1
task_id: MODEL-004
model_id: M-PHY-001
model_version: physiology-expert-v3.3.3

run:
  run_id: MH-20260731-004

data:
  datasets:
    - resilient
  excluded_datasets:
    - psyche_d
    - nhanes
    - shenzhen_elderly
    - nhanes_ssq_2005_2008
  target: binary_target
  feature_schema_version: mood_social_feature_schema_v3_3_3
  feature_schema_sha256: d2ed18db72601ccb3b0cbb89907bc60ab336bd00f84f0b2c49dcea568bf339e9
  split_id: mood-social-v3.3.3-participant-nested-5x5-seed-20260728-v1
  split_sha256: e9915dbc590a6ea454c34d26558ac5866c57ee8a8e78f44cdcc79c859df77ee3
  sample_weighting: dataset_equal_then_class_equal_then_participant_class_equal_then_repeat_window_equal

preprocessing:
  source_transform: resilient_canonical_same_semantics_identity
  imputation: training_fold_median
  categorical_encoding: numeric_identity_no_categorical_inputs
  standardization: training_fold_mean_std_after_median_imputation
  feature_selection: training_fold_finite_nonconstant
  add_missing_indicators: false
  use_feature_masks_as_risk_inputs: false
  use_feature_coverage_as_risk_input: false
  use_activity_or_sleep_as_risk_inputs: false

search:
  traversal: deterministic_full_grid
  candidate_count: 20
  auprc_tie_tolerance: 1.0e-12
  selection: highest_pooled_inner_oof_auprc_then_lowest_pooled_inner_oof_brier_then_candidate_id
  final_selection: pooled_nested_inner_oof_only_without_outer_test_metrics
  space:
    C: [0.01, 0.1, 1, 10]
    l1_ratio: [0, 0.25, 0.5, 0.75, 1]

calibration:
  method: platt
  fit_input: strict_cross_fitted_raw_probability
  fit_weighting: frozen_training_sample_weight
  probability_clip_epsilon: 1.0e-6

evaluation:
  primary_metric: auprc
  tie_break_metric: brier_score
  decision_threshold: 0.5
  ece_binning: equal_width
  ece_bin_count: 10
  metrics:
    - auprc
    - auroc
    - macro_f1
    - sensitivity
    - specificity
    - brier_score
    - ece
  report_scopes:
    - overall
    - by_dataset
    - by_outer_fold
  performance_gate: none

runtime:
  random_seed: 20260728
  logistic_solver: saga
  logistic_max_iter: 5000
  deterministic: true
