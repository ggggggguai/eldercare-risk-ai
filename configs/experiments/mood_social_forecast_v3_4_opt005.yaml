  opt004_corrected_outer: artifacts/mental_health/mood_social/forecast_v3.4/optimization_candidates/MH-20260809-FOPT-026/outer_oof_predictions.parquet
  feature_contexts:
    forecast_1m: artifacts/mental_health/mood_social/forecast_v3.4/optimization_candidates/MH-20260808-FOPT-005/context_forecast_1m.parquet
    forecast_2m: artifacts/mental_health/mood_social/forecast_v3.4/optimization_candidates/MH-20260808-FOPT-005/context_forecast_2m.parquet
  expected_sha256:
