[project]
name = "elderly-monitoring-algorithms"
version = "0.2.0"
description = "Algorithm prototypes for fall risk and mental health risk warning."
requires-python = ">=3.10"
dependencies = [
  "pydantic==2.13.4",
  "PyYAML==6.0.3"
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1"
]
vision = [
  "opencv-python==4.13.0.92",
  "ultralytics==8.4.78"
]
service = [
  "fastapi==0.116.1",
  "Pillow==12.1.0",
  "uvicorn==0.35.0",
  "httpx==0.28.1"
]
ml = [
  "numpy==2.4.6",
  "pandas==3.0.3",
  "pyarrow==21.0.0",
  "joblib==1.5.3",
  "scikit-learn==1.9.0",
  "lightgbm==4.6.0",
  "catboost==1.2.10",
  "matplotlib==3.11.0",
  "shap==0.51.0",
  "openpyxl==3.1.5",
  "xlrd==2.0.2",
  "interpret-core==0.7.8",
  "torch==2.12.1"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
